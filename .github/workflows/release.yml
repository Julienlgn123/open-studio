name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─── Windows ────────────────────────────────────────────────
  build-windows:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows (NSIS + Portable)
        run: npm run dist -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/dist-installer/*.exe
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

  # ─── macOS ─────────────────────────────────────────────────
  build-mac:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS (DMG x64 + arm64)
        run: npm run dist:mac -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Developer ID cert available: leave identity/CSC_* unset so
          # electron-builder falls back to ad-hoc signing (`codesign -s -`).
          # A fully unsigned arm64 app is rejected by Gatekeeper as "damaged" —
          # ad-hoc signing is the free fix. Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false
          # here, it disables that fallback too.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-mac
          path: |
            apps/${{ matrix.app }}/dist-installer/*.dmg
            apps/${{ matrix.app }}/dist-installer/*.zip
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

  # ─── Linux ─────────────────────────────────────────────────
  build-linux:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm install

      - name: Build Linux (AppImage + deb)
        run: npm run dist:linux -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            apps/${{ matrix.app }}/dist-installer/*.AppImage
            apps/${{ matrix.app }}/dist-installer/*.deb
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

  # ─── Create Release ─────────────────────────────────────────
  # Une seule release pour toute la suite : le hub (auto-update via electron-updater)
  # et chaque app qu'il installe (assets préfixés, cf. apps/hub/src/main/catalog.ts).
  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Open Studio Suite v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🗂️ Open Studio Suite v${{ steps.version.outputs.VERSION }}

            Installe **Open Studio** une seule fois : il télécharge, installe et lance
            chaque app de la suite depuis son catalogue, et gère leurs mises à jour —
            aucune des apps gérées ne se télécharge séparément.

            ### 🪟 Windows — installer Open Studio
            | Fichier | Description |
            |---|---|
            | `Open-Studio-Setup-*.exe` | Installateur (recommandé) |
            | `Open-Studio-Portable-*.exe` | Portable — clé USB, aucune installation |

            ### 🍎 macOS — installer Open Studio
            | Fichier | Description |
            |---|---|
            | `Open-Studio-*-x64.dmg` | Mac Intel (2020 et avant) |
            | `Open-Studio-*-arm64.dmg` | Mac Apple Silicon M1/M2/M3/M4 |

            > ⚠️ Première ouverture sur macOS : pas de certificat Apple Developer payant,
            > donc l'app n'est signée qu'en *ad-hoc* → macOS affiche **« Open Studio est
            > endommagée et ne peut pas être ouverte »** (le clic droit → Ouvrir ne suffit
            > pas ici, contrairement à une vraie app non-notariée). Ouvre **Terminal** et lance :
            > ```
            > xattr -cr "/Applications/Open Studio.app"
            > ```
            > puis ouvre l'app normalement. (Ou double-clique `Fix-macOS-Signature.command`
            > fourni avec le `.dmg`.)

            ### 🐧 Linux — installer Open Studio
            | Fichier | Description |
            |---|---|
            | `Open-Studio-*.AppImage` | Universel — toutes les distros |
            | `Open-Studio-*.deb` | Debian / Ubuntu / Mint |

            ---
            Les fichiers `Cours-Studio-*` et `Drive-Studio-*` de cette release sont ceux
            qu'Open Studio télécharge lui-même depuis son catalogue — pas besoin de les
            récupérer ici.

            🔄 Mises à jour automatiques au démarrage (Open Studio uniquement).
          files: dist-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub liste tous les fichiers d'une release, sans distinction — on ne
      # peut pas cacher les installateurs des apps gérées, juste rendre très
      # clair qu'il ne faut pas les télécharger directement ici (label affiché
      # à la place du nom de fichier dans l'UI GitHub).
      - name: Label managed-app assets as internal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq \
            '.assets[] | select(((.name | startswith("Open-Studio")) or (.name | endswith(".yml"))) | not) | .id' |
          while read -r id; do
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
              -f label="Géré par Open Studio — ne pas télécharger ici"
          done
