name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─── Windows ────────────────────────────────────────────────
  build-windows:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio, local-ia-studio]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Windows Defender scanning a file mid-write is the usual cause of the
      # intermittent "Access to the path is denied" MSBuild failures seen here
      # while electron-rebuild compiles better-sqlite3 for Electron's ABI.
      - name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell

      # Scoped to this one workspace: a plain `npm install` at the repo root
      # runs *every* workspace's postinstall, including sibling apps not even
      # part of this job — each one an extra
      # electron-rebuild that only adds more chances to hit the flaky failure
      # above for no reason.
      - name: Install dependencies
        run: npm install -w apps/${{ matrix.app }}

      - name: Build Windows
        run: npm run dist -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le hub garde tout (portable + blockmap : son propre auto-updater en a
      # besoin) ; les apps gérées n'exposent que leur unique installateur —
      # Open Studio ne regarde jamais que ça, le reste n'est que du bruit sur
      # la page de release.
      - name: Upload artifacts (hub)
        if: matrix.app == 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/dist-installer/*.exe
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

      - name: Upload artifacts (managed app)
        if: matrix.app != 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: apps/${{ matrix.app }}/dist-installer/*.exe

  # ─── macOS ─────────────────────────────────────────────────
  build-mac:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio, local-ia-studio]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scoped to this one workspace — see the Windows job for why.
      - name: Install dependencies
        run: npm install -w apps/${{ matrix.app }}

      - name: Build macOS (DMG x64 + arm64)
        run: npm run dist:mac -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Developer ID cert available: leave identity/CSC_* unset so
          # electron-builder falls back to ad-hoc signing (`codesign -s -`).
          # A fully unsigned arm64 app is rejected by Gatekeeper as "damaged" —
          # ad-hoc signing is the free fix. Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false
          # here, it disables that fallback too.

      - name: Upload artifacts (hub)
        if: matrix.app == 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-mac
          path: |
            apps/${{ matrix.app }}/dist-installer/*.dmg
            apps/${{ matrix.app }}/dist-installer/*.zip
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

      - name: Upload artifacts (managed app)
        if: matrix.app != 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-mac
          path: apps/${{ matrix.app }}/dist-installer/*.dmg

  # ─── Linux ─────────────────────────────────────────────────
  build-linux:
    strategy:
      matrix:
        app: [hub, cours-studio, drive-studio, local-ia-studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      # Scoped to this one workspace — see the Windows job for why.
      - name: Install dependencies
        run: npm install -w apps/${{ matrix.app }}

      - name: Build Linux (AppImage + deb)
        run: npm run dist:linux -w apps/${{ matrix.app }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (hub)
        if: matrix.app == 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            apps/${{ matrix.app }}/dist-installer/*.AppImage
            apps/${{ matrix.app }}/dist-installer/*.deb
            apps/${{ matrix.app }}/dist-installer/*.yml
            !apps/${{ matrix.app }}/dist-installer/builder-debug.yml
            apps/${{ matrix.app }}/dist-installer/*.blockmap

      - name: Upload artifacts (managed app)
        if: matrix.app != 'hub'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: apps/${{ matrix.app }}/dist-installer/*.deb

  # ─── Create Release ─────────────────────────────────────────
  # Une seule release pour toute la suite : le hub (auto-update via electron-updater)
  # et chaque app qu'il installe (assets préfixés, cf. apps/hub/src/main/catalog.ts).
  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique et tags complets : suite-manifest.mjs compare avec la release précédente.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Un zip par OS avec les installateurs de toute la suite dedans — la
      # personne ne télécharge que celui de son système, pas les deux autres.
      - name: Bundle one zip per OS
        run: |
          mkdir -p bundle/windows bundle/mac bundle/linux

          cp dist-artifacts/Open-Studio-Setup-*.exe bundle/windows/
          cp dist-artifacts/Cours-Studio-Setup-*.exe bundle/windows/
          cp dist-artifacts/Drive-Studio-Setup-*.exe bundle/windows/
          cp dist-artifacts/Local-IA-Studio-Setup-*.exe bundle/windows/
          cat > bundle/windows/Lire-moi.txt <<'EOF'
          Lance l'installateur de l'app que tu veux :
          - Open-Studio-Setup-*.exe (recommandé, installe/lance/met à jour les autres)
          - Cours-Studio-Setup-*.exe
          - Drive-Studio-Setup-*.exe
          - Local-IA-Studio-Setup-*.exe
          EOF
          (cd bundle/windows && zip -r "../../dist-artifacts/Open-Studio-Windows.zip" .)

          cp dist-artifacts/Open-Studio-*.dmg bundle/mac/
          cp dist-artifacts/Cours-Studio-*.dmg bundle/mac/
          cp dist-artifacts/Drive-Studio-*.dmg bundle/mac/
          cp dist-artifacts/Local-IA-Studio-*.dmg bundle/mac/
          cat > bundle/mac/Lire-moi.txt <<'EOF'
          Choisis le .dmg "arm64" (Apple Silicon M1/M2/M3/M4) ou "x64" (Intel)
          de l'app que tu veux installer. Open-Studio-*.dmg est recommandé :
          il installe/lance/met à jour les autres apps depuis son catalogue.

          Première ouverture : macOS affiche "app endommagée" (pas de certificat
          Apple Developer payant) -> Terminal -> xattr -cr "/Applications/NomDeLApp.app"
          EOF
          (cd bundle/mac && zip -r "../../dist-artifacts/Open-Studio-macOS.zip" .)

          cp dist-artifacts/Open-Studio-*.AppImage dist-artifacts/Open-Studio-*.deb bundle/linux/
          cp dist-artifacts/Cours-Studio-*.deb bundle/linux/
          cp dist-artifacts/Drive-Studio-*.deb bundle/linux/
          cp dist-artifacts/Local-IA-Studio-*.deb bundle/linux/
          cat > bundle/linux/Lire-moi.txt <<'EOF'
          Lance le .deb (Debian/Ubuntu/Mint) ou l'AppImage de l'app que tu veux.
          Open-Studio.* est recommandé : il installe/lance/met à jour les autres
          apps depuis son catalogue.
          EOF
          (cd bundle/linux && zip -r "../../dist-artifacts/Open-Studio-Linux.zip" .)

          # Les apps gérées n'ont plus besoin d'exister comme assets
          # de release à part : ils sont déjà dans les 3 zips ci-dessus, et
          # Open Studio les récupère lui-même en les extrayant de là (voir
          # apps/hub/src/main/install/zipSource.ts) plutôt que d'aller
          # chercher un fichier séparé par nom.
          rm -f dist-artifacts/Cours-Studio-* dist-artifacts/Drive-Studio-* dist-artifacts/Local-IA-Studio-*

      # Vraie version de chaque app (le numéro de la release concerne toute la suite) :
      # Open Studio ne propose une mise à jour que si l'app a réellement changé.
      - name: Write suite-versions.json
        run: node .github/scripts/suite-manifest.mjs "${GITHUB_REF_NAME}" dist-artifacts/suite-versions.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Open Studio Suite v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🗂️ Open Studio Suite v${{ steps.version.outputs.VERSION }}

            Installe **Open Studio** une seule fois : il télécharge, installe et lance
            chaque app de la suite depuis son catalogue, et gère leurs mises à jour —
            aucune des apps gérées ne se télécharge séparément.

            ### 📦 Télécharge le zip de ton système

            | Système | Fichier |
            |---|---|
            | 🪟 Windows | `Open-Studio-Windows.zip` |
            | 🍎 macOS | `Open-Studio-macOS.zip` |
            | 🐧 Linux | `Open-Studio-Linux.zip` |

            Dézippe-le et lance l'installateur `Open-Studio-*` dedans (les
            installateurs de Cours Studio/Drive Studio/Local IA Studio sont là aussi si tu veux
            les installer directement, mais Open Studio les propose déjà depuis
            son catalogue).

            > ⚠️ Première ouverture sur macOS : pas de certificat Apple Developer payant,
            > donc l'app n'est signée qu'en *ad-hoc* → macOS affiche **« Open Studio est
            > endommagée et ne peut pas être ouverte »** (le clic droit → Ouvrir ne suffit
            > pas ici, contrairement à une vraie app non-notariée). Ouvre **Terminal** et lance :
            > ```
            > xattr -cr "/Applications/Open Studio.app"
            > ```
            > puis ouvre l'app normalement.

            ---
            Tous les autres fichiers ci-dessous sont ceux qu'Open Studio et son
            mécanisme de mise à jour utilisent automatiquement en arrière-plan —
            pas besoin d'en télécharger un directement, sers-toi des 3 zips au-dessus.

            🔄 Open Studio se met à jour tout seul, et met à jour les apps installées dès qu'elles ont une nouvelle version.
          files: dist-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reste ici : uniquement les fichiers propres au hub (Setup/blockmap/yml),
      # indispensables tels quels à son propre auto-updater — GitHub ne permet
      # pas de les cacher, juste de rendre très clair qu'il ne faut pas les
      # télécharger directement (label affiché à la place du nom de fichier).
      - name: Label individual installers as internal-use-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq \
            '.assets[] as $a | select(((["Open-Studio-Windows.zip","Open-Studio-macOS.zip","Open-Studio-Linux.zip","suite-versions.json"] | index($a.name)) or ($a.name | endswith(".yml"))) | not) | $a.id' |
          while read -r id; do
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
              -f label="Utilisé automatiquement — télécharge plutôt le zip de ton OS"
          done
